<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <div class="container">
        <h1>Галерея изображений</h1>
        <div class="swiper gallery-slider">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="image1.png" alt="Image 1" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image2.jpg" alt="Image 2" class="card-image width="300" height="200"">
                </div>
                <div class="swiper-slide">
                    <img src="image3.jpg" alt="Image 3" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image4.jpg" alt="Image 4" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image5.jpg" alt="Image 5" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image6.jpg" alt="Image 6" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image7.jpg" alt="Image 7" class="card-image" width="300" height="200">
                </div>
                <div class="swiper-slide">
                    <img src="image8.jpg" alt="Image 8" class="card-image" width="300" height="200">
                </div>
            </div>

            <!-- Кнопки навигации -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
        
        <!-- Пагинация -->
        <div class="swiper-pagination"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
