<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <div class="container">
        <div class="swiper gallery-slider">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/FF6B6B/FFFFFF?text=Изображение+1" alt="Image 1" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/4ECDC4/FFFFFF?text=Изображение+2" alt="Image 2" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/45B7D1/FFFFFF?text=Изображение+3" alt="Image 3" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/96CEB4/FFFFFF?text=Изображение+4" alt="Image 4" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/FECA57/FFFFFF?text=Изображение+5" alt="Image 5" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/FF9FF3/FFFFFF?text=Изображение+6" alt="Image 6" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/54A0FF/FFFFFF?text=Изображение+7" alt="Image 7" class="gallery-image">
                </div>
                <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x300/5F27CD/FFFFFF?text=Изображение+8" alt="Image 8" class="gallery-image">
                </div>
            </div>

            <!-- Кнопки навигации -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            
            <!-- Пагинация -->
            <div class="swiper-pagination"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
